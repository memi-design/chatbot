name: Static checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, unit test, and dependency audit
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run check
        run: pnpm check
      - name: Typecheck and unit test
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsx --test lib/ai/models.test.ts
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
      - name: Build without external services
        run: PLAYWRIGHT=True pnpm exec next build
