name: Memi Design CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-quality:
    name: Design quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: sarveshsea/memi@v2.5.0
        with:
          version: "2.5.0"
          target: "."
          report: "true"
          upload-sarif: "false"
